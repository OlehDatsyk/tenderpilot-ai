name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests on PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tenderpilot
          POSTGRES_PASSWORD: tenderpilot
          POSTGRES_DB: tenderpilot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tenderpilot -d tenderpilot_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      # Throwaway CI-only database credentials; no real secrets are needed (AI providers are mocked).
      TEST_DATABASE_URL: postgresql+psycopg://tenderpilot:tenderpilot@127.0.0.1:5432/tenderpilot_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check app tests
      - name: Mypy
        run: mypy app
      - name: Tests (PostgreSQL)
        run: pytest -q
      - name: Tests (SQLite)
        run: TEST_DATABASE_URL= pytest -q

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
