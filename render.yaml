# Render Blueprint for TenderPilot AI: FastAPI web service + static React frontend, all on free plans.
#
# DEMO MODE (current): no database server. EPHEMERAL_DEMO=true lets the API keep its data in a SQLite file on
# the free instance's disk, which Render WIPES on every restart, redeploy and idle spin-down (~15 min).
# The app shows a permanent "data is temporary" banner. AI runs in labelled demo mode.
#
# For persistent data, point DATABASE_URL at PostgreSQL and remove EPHEMERAL_DEMO:
#   - external (e.g. a free Neon database): DATABASE_URL -> `sync: false`, then paste the connection string
#     in the Render dashboard (never commit it here); or
#   - Render-managed: add
#   databases:
#     - name: tenderpilot-ai-db
#       databaseName: tenderpilot
#       plan: basic-256mb        # or free, if your workspace's free Postgres slot is unused
# and replace the DATABASE_URL entry below with:
#   fromDatabase: { name: tenderpilot-ai-db, property: connectionString }
#
# Free web services sleep after ~15 minutes idle (first request afterwards is slow).

services:
  - type: web
    name: tenderpilot-ai-api
    runtime: python
    rootDir: backend
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    # Migrations are additive/non-destructive and run on every start before the server binds.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/ready
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        value: sqlite:///./tenderpilot-demo.db # temporary demo data - see the header comment
      - key: EPHEMERAL_DEMO
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://tenderpilot-ai-frontend.onrender.com
      - key: FRONTEND_URL
        value: https://tenderpilot-ai-frontend.onrender.com
      - key: TRUSTED_PROXY_HEADERS
        value: "true"
      - key: STORAGE_BACKEND
        value: database
      - key: MAX_UPLOAD_MB
        value: "20"
      - key: DOCS_ENABLED
        value: "true"
      - key: REGISTRATION_ENABLED
        value: "true"
      - key: AI_PROVIDER
        value: demo # labelled rule-based demo; set anthropic/openai/gemini (with a key) for real AI
      - key: AI_MODEL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DB_POOL_SIZE
        value: "3"
      - key: DB_MAX_OVERFLOW
        value: "2"

  - type: web
    name: tenderpilot-ai-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci --no-audit --no-fund && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: tenderpilot-ai-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://*.onrender.com; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
